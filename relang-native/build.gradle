plugins {
    id 'java'
    alias(libs.plugins.graalvm.native)
}

dependencies {
    implementation project(':relang-core')

    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()

    // Pass the native binary path to tests
    systemProperty 'relang.native.binary', layout.buildDirectory.file('native/nativeCompile/relang').get().asFile.absolutePath

    // Tests depend on the native binary being built
    dependsOn 'nativeCompile'
}

graalvmNative {
    binaries {
        main {
            imageName = 'relang'
            mainClass = 'com.relang.ReLangLauncher'
            buildArgs.addAll([
                '--no-fallback',
                '-H:+ReportExceptionStackTraces',
                '-H:+UnlockExperimentalVMOptions',
                '--initialize-at-build-time=com.relang',
                '--initialize-at-build-time=org.antlr.v4.runtime',
                '--initialize-at-build-time=com.google.gson',
                '--initialize-at-build-time=com.google.protobuf'
            ])
            // Enable native access for Truffle FFM API calls during build
            buildArgs.add('-J--enable-native-access=ALL-UNNAMED')
        }
    }
    metadataRepository {
        enabled = true
    }
}
