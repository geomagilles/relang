plugins {
    id 'application'
    id 'antlr'
    id 'com.google.protobuf'
}

dependencies {
    antlr "org.antlr:antlr4:4.13.2"
    implementation "org.antlr:antlr4-runtime:4.13.2"

    implementation 'org.graalvm.truffle:truffle-api:25.0.0'
    implementation 'org.graalvm.polyglot:polyglot:25.0.0'

    // Annotation processor for Truffle DSL
    annotationProcessor 'org.graalvm.truffle:truffle-dsl-processor:25.0.0'

    // JSON serialization for ResumableState
    implementation 'com.google.code.gson:gson:2.13.2'

    // Protobuf serialization for ResumableState
    implementation 'com.google.protobuf:protobuf-java:4.33.4'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:4.33.4'
    }
}

application {
    mainClass = 'com.relang.ReLangLauncher'
}
