plugins {
    id 'application'
    id 'antlr'
    alias(libs.plugins.protobuf)
}

dependencies {
    antlr libs.antlr
    implementation libs.antlr.runtime

    implementation libs.graalvm.truffle.api
    implementation libs.graalvm.polyglot

    // GraalVM tools for debugging
    runtimeOnly libs.graalvm.tools.dap

    // LSP types for publishing diagnostics (provided at runtime by lsp-tool)
    compileOnly libs.graalvm.tools.lsp

    // Annotation processor for Truffle DSL
    annotationProcessor libs.graalvm.truffle.dsl.processor

    // JSON serialization for ResumableState
    implementation libs.gson

    // Protobuf serialization for ResumableState
    implementation libs.protobuf.java

    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

protobuf {
    protoc {
        artifact = libs.protobuf.protoc.get().toString()
    }
}

generateGrammarSource {
    arguments += ['-visitor']
}

application {
    mainClass = 'com.relang.ReLangLauncher'
}
