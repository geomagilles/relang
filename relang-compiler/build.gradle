plugins {
    id 'java'
    id 'application'
    alias(libs.plugins.graalvm.native)
}

dependencies {
    implementation project(':relang-core')
    implementation libs.graalvm.polyglot
    implementation libs.protobuf.java

    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()

    // Pass classpath to tests for running the compiler
    systemProperty 'relang.compiler.classpath', sourceSets.main.runtimeClasspath.asPath

    // Tests depend on classes being compiled
    dependsOn 'classes'
}

application {
    mainClass = 'com.relang.compiler.ReLangCompiler'
}

jar {
    dependsOn ':relang-core:jar'
    manifest {
        attributes 'Main-Class': 'com.relang.compiler.ReLangCompiler'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

graalvmNative {
    binaries {
        main {
            imageName = 'relangc'
            mainClass = 'com.relang.compiler.ReLangCompiler'
            buildArgs.addAll([
                '--no-fallback',
                '-H:+ReportExceptionStackTraces'
            ])
        }
    }
}
